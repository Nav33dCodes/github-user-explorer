<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple GitHub profile explorer built with HTML, CSS and JavaScript."
    >

    <title>GitHub User Explorer</title>

    <style>
        :root {
            --bg: #f6f8fa;
            --card: #ffffff;
            --soft: #f3f4f6;
            --border: #d0d7de;
            --text: #1f2328;
            --muted: #656d76;
            --blue: #0969da;
            --green: #1f883d;
            --danger: #cf222e;
            --shadow: 0 8px 24px rgba(140, 149, 159, 0.15);
        }

        body.dark {
            --bg: #0d1117;
            --card: #161b22;
            --soft: #21262d;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --blue: #58a6ff;
            --green: #3fb950;
            --danger: #f85149;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
            transition: background 0.2s, color 0.2s;
        }

        button,
        input {
            font: inherit;
        }

        a {
            color: var(--blue);
        }

        .container {
            width: min(1050px, calc(100% - 32px));
            margin: auto;
        }

        header {
            border-bottom: 1px solid var(--border);
            background: var(--card);
        }

        nav {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 700;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: var(--text);
            color: var(--card);
        }

        .theme-button {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
        }

        .hero {
            padding: 65px 0 45px;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(32px, 6vw, 52px);
            letter-spacing: -1.5px;
        }

        .hero p {
            max-width: 650px;
            margin: 15px auto 28px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.6;
        }

        .search-box {
            max-width: 720px;
            margin: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 9px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .search-box input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--bg);
            color: var(--text);
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.12);
        }

        .button {
            padding: 12px 17px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--card);
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
        }

        .button-primary {
            border-color: var(--green);
            background: var(--green);
            color: white;
        }

        .button:hover {
            filter: brightness(0.96);
        }

        .recent-searches {
            max-width: 720px;
            min-height: 32px;
            margin: 15px auto 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
        }

        .recent-button {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--card);
            color: var(--muted);
            cursor: pointer;
            font-size: 13px;
        }

        .status {
            display: none;
            margin: 20px 0;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--muted);
            text-align: center;
        }

        .status.visible {
            display: block;
        }

        .status.error {
            color: var(--danger);
            border-color: var(--danger);
        }

        .results {
            display: none;
            padding-bottom: 60px;
        }

        .results.visible {
            display: block;
        }

        .card {
            padding: 22px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .profile-card {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 22px;
        }

        .avatar {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            border: 1px solid var(--border);
        }

        .profile-card h2 {
            margin: 0 0 4px;
            font-size: 29px;
        }

        .username {
            color: var(--blue);
            font-weight: 600;
        }

        .bio {
            margin: 12px 0;
            color: var(--muted);
            line-height: 1.55;
        }

        .profile-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            color: var(--muted);
            font-size: 14px;
        }

        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .profile-actions a {
            text-decoration: none;
            text-align: center;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 16px 0;
        }

        .stat {
            padding: 18px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 9px;
        }

        .stat strong {
            display: block;
            font-size: 25px;
        }

        .stat span {
            color: var(--muted);
            font-size: 13px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1.8fr;
            gap: 16px;
        }

        .section-title {
            margin: 0 0 17px;
            font-size: 19px;
        }

        .language-list {
            display: grid;
            gap: 13px;
        }

        .language-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .language-bar {
            height: 7px;
            overflow: hidden;
            border-radius: 10px;
            background: var(--soft);
        }

        .language-fill {
            height: 100%;
            border-radius: inherit;
            background: var(--blue);
        }

        .repo-list {
            display: grid;
            gap: 11px;
        }

        .repo {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--soft);
        }

        .repo-name {
            font-weight: 700;
            text-decoration: none;
        }

        .repo-description {
            margin: 8px 0 12px;
            min-height: 22px;
            color: var(--muted);
            line-height: 1.45;
            font-size: 14px;
        }

        .repo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 13px;
            color: var(--muted);
            font-size: 13px;
        }

        .activity-card {
            margin-top: 16px;
        }

        .activity-list {
            display: grid;
            gap: 9px;
        }

        .activity-item {
            padding: 13px;
            display: flex;
            gap: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--soft);
        }

        .activity-icon {
            font-size: 19px;
        }

        .activity-text {
            line-height: 1.45;
        }

        .activity-time {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .empty {
            color: var(--muted);
            text-align: center;
        }

        footer {
            padding: 25px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .profile-card {
                grid-template-columns: auto 1fr;
            }

            .profile-actions {
                grid-column: 1 / -1;
                flex-direction: row;
            }

            .profile-actions > * {
                flex: 1;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 580px) {
            .hero {
                padding-top: 42px;
            }

            .search-box {
                grid-template-columns: 1fr;
            }

            .profile-card {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .avatar {
                margin: auto;
            }

            .profile-meta {
                justify-content: center;
            }

            .profile-actions {
                grid-column: auto;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav class="container">
            <div class="logo">
                <div class="logo-icon">GH</div>
                <span>GitHub User Explorer</span>
            </div>

            <button
                id="themeButton"
                class="theme-button"
                type="button"
                title="Change theme"
            >
                🌙
            </button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Explore GitHub profiles</h1>

                <p>
                    Search for a developer and view their repositories,
                    languages, stars and recent public activity.
                </p>

                <form id="searchForm" class="search-box">
                    <input
                        id="usernameInput"
                        type="text"
                        placeholder="Enter GitHub username"
                        autocomplete="off"
                    >

                    <button class="button button-primary" type="submit">
                        Search
                    </button>

                    <button
                        id="randomButton"
                        class="button"
                        type="button"
                    >
                        Random
                    </button>
                </form>

                <div
                    id="recentSearches"
                    class="recent-searches"
                ></div>
            </div>
        </section>

        <div class="container">
            <div id="status" class="status"></div>

            <section id="results" class="results">
                <article class="card profile-card">
                    <img
                        id="avatar"
                        class="avatar"
                        src=""
                        alt="GitHub profile avatar"
                    >

                    <div>
                        <h2 id="name"></h2>
                        <div id="username" class="username"></div>
                        <p id="bio" class="bio"></p>
                        <div id="profileMeta" class="profile-meta"></div>
                    </div>

                    <div class="profile-actions">
                        <a
                            id="profileLink"
                            class="button button-primary"
                            href="#"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Open GitHub
                        </a>

                        <button
                            id="shareButton"
                            class="button"
                            type="button"
                        >
                            Copy link
                        </button>
                    </div>
                </article>

                <section id="stats" class="stats"></section>

                <div class="content-grid">
                    <article class="card">
                        <h3 class="section-title">Languages</h3>
                        <div id="languages" class="language-list"></div>
                    </article>

                    <article class="card">
                        <h3 class="section-title">Top repositories</h3>
                        <div id="repositories" class="repo-list"></div>
                    </article>
                </div>

                <article class="card activity-card">
                    <h3 class="section-title">Recent public activity</h3>
                    <div id="activity" class="activity-list"></div>
                </article>
            </section>
        </div>
    </main>

    <footer>
        Built with HTML, CSS, JavaScript and the GitHub API.
    </footer>

    <script>
        const API_URL = "https://api.github.com";

        const randomUsers = [
            "torvalds",
            "sindresorhus",
            "addyosmani",
            "gaearon",
            "kentcdodds",
            "cassidoo"
        ];

        const form = document.getElementById("searchForm");
        const usernameInput = document.getElementById("usernameInput");
        const randomButton = document.getElementById("randomButton");
        const themeButton = document.getElementById("themeButton");
        const shareButton = document.getElementById("shareButton");

        const statusBox = document.getElementById("status");
        const results = document.getElementById("results");
        const recentSearches = document.getElementById("recentSearches");

        let currentUsername = "";

        setupTheme();
        showRecentSearches();
        loadUserFromUrl();

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            searchUser(usernameInput.value);
        });

        randomButton.addEventListener("click", function () {
            const randomIndex = Math.floor(
                Math.random() * randomUsers.length
            );

            usernameInput.value = randomUsers[randomIndex];
            searchUser(usernameInput.value);
        });

        themeButton.addEventListener("click", function () {
            const darkMode = document.body.classList.toggle("dark");

            localStorage.setItem(
                "explorer-theme",
                darkMode ? "dark" : "light"
            );

            themeButton.textContent = darkMode ? "☀️" : "🌙";
        });

        shareButton.addEventListener("click", async function () {
            const url = new URL(window.location.href);
            url.searchParams.set("user", currentUsername);

            try {
                await navigator.clipboard.writeText(url.toString());
                shareButton.textContent = "Copied";

                setTimeout(function () {
                    shareButton.textContent = "Copy link";
                }, 1500);
            } catch {
                alert("Could not copy the link.");
            }
        });

        async function searchUser(rawUsername) {
            const username = rawUsername.trim().replace(/^@/, "");

            if (!isValidUsername(username)) {
                showStatus("Please enter a valid GitHub username.", true);
                return;
            }

            currentUsername = username;
            usernameInput.value = username;

            saveRecentSearch(username);
            showRecentSearches();
            updateUrl(username);

            showStatus("Loading GitHub profile...");
            results.classList.remove("visible");

            try {
                const profileResponse = await fetch(
                    `${API_URL}/users/${encodeURIComponent(username)}`
                );

                if (profileResponse.status === 404) {
                    throw new Error("GitHub user not found.");
                }

                if (profileResponse.status === 403) {
                    throw new Error(
                        "GitHub API limit reached. Please try again later."
                    );
                }

                if (!profileResponse.ok) {
                    throw new Error("Could not load this GitHub profile.");
                }

                const profile = await profileResponse.json();

                const [reposResponse, eventsResponse] =
                    await Promise.all([
                        fetch(
                            `${API_URL}/users/${encodeURIComponent(username)}` +
                            `/repos?per_page=100&sort=updated&type=owner`
                        ),

                        fetch(
                            `${API_URL}/users/${encodeURIComponent(username)}` +
                            `/events/public?per_page=10`
                        )
                    ]);

                const repositories = reposResponse.ok
                    ? await reposResponse.json()
                    : [];

                const events = eventsResponse.ok
                    ? await eventsResponse.json()
                    : [];

                renderProfile(profile, repositories, events);

                hideStatus();
                results.classList.add("visible");
            } catch (error) {
                showStatus(error.message, true);
            }
        }

        function renderProfile(profile, repositories, events) {
            const originalRepositories = repositories.filter(
                repository => !repository.fork
            );

            const totalStars = originalRepositories.reduce(
                (total, repository) =>
                    total + repository.stargazers_count,
                0
            );

            document.getElementById("avatar").src = profile.avatar_url;
            document.getElementById("name").textContent =
                profile.name || profile.login;

            document.getElementById("username").textContent =
                `@${profile.login}`;

            document.getElementById("bio").textContent =
                profile.bio || "No bio has been added.";

            document.getElementById("profileLink").href =
                profile.html_url;

            renderProfileMeta(profile);
            renderStats(profile, originalRepositories, totalStars);
            renderLanguages(originalRepositories);
            renderRepositories(originalRepositories);
            renderActivity(events);
        }

        function renderProfileMeta(profile) {
            const details = [];

            if (profile.location) {
                details.push(`📍 ${escapeHtml(profile.location)}`);
            }

            if (profile.company) {
                details.push(`🏢 ${escapeHtml(profile.company)}`);
            }

            details.push(`Joined ${formatDate(profile.created_at)}`);

            document.getElementById("profileMeta").innerHTML =
                details
                    .map(detail => `<span>${detail}</span>`)
                    .join("");
        }

        function renderStats(profile, repositories, totalStars) {
            const stats = [
                {
                    value: repositories.length,
                    label: "Repositories"
                },
                {
                    value: profile.followers,
                    label: "Followers"
                },
                {
                    value: profile.following,
                    label: "Following"
                },
                {
                    value: totalStars,
                    label: "Total stars"
                }
            ];

            document.getElementById("stats").innerHTML =
                stats
                    .map(stat => `
                        <div class="stat">
                            <strong>${formatNumber(stat.value)}</strong>
                            <span>${stat.label}</span>
                        </div>
                    `)
                    .join("");
        }

        function renderLanguages(repositories) {
            const languageCount = {};

            repositories.forEach(repository => {
                if (!repository.language) return;

                languageCount[repository.language] =
                    (languageCount[repository.language] || 0) + 1;
            });

            const languages = Object.entries(languageCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6);

            const container = document.getElementById("languages");

            if (languages.length === 0) {
                container.innerHTML =
                    `<p class="empty">No language data available.</p>`;
                return;
            }

            const total = languages.reduce(
                (sum, language) => sum + language[1],
                0
            );

            container.innerHTML = languages
                .map(([language, count]) => {
                    const percentage = Math.round(
                        (count / total) * 100
                    );

                    return `
                        <div>
                            <div class="language-header">
                                <strong>${escapeHtml(language)}</strong>
                                <span>${percentage}%</span>
                            </div>

                            <div class="language-bar">
                                <div
                                    class="language-fill"
                                    style="width: ${percentage}%"
                                ></div>
                            </div>
                        </div>
                    `;
                })
                .join("");
        }

        function renderRepositories(repositories) {
            const topRepositories = [...repositories]
                .sort((a, b) => {
                    if (b.stargazers_count !== a.stargazers_count) {
                        return b.stargazers_count - a.stargazers_count;
                    }

                    return (
                        new Date(b.updated_at) -
                        new Date(a.updated_at)
                    );
                })
                .slice(0, 6);

            const container =
                document.getElementById("repositories");

            if (topRepositories.length === 0) {
                container.innerHTML =
                    `<p class="empty">No public repositories found.</p>`;
                return;
            }

            container.innerHTML = topRepositories
                .map(repository => `
                    <div class="repo">
                        <a
                            class="repo-name"
                            href="${repository.html_url}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${escapeHtml(repository.name)}
                        </a>

                        <p class="repo-description">
                            ${escapeHtml(
                                repository.description ||
                                "No description provided."
                            )}
                        </p>

                        <div class="repo-meta">
                            <span>
                                ${escapeHtml(
                                    repository.language || "Various"
                                )}
                            </span>

                            <span>
                                ⭐ ${formatNumber(
                                    repository.stargazers_count
                                )}
                            </span>

                            <span>
                                🍴 ${formatNumber(
                                    repository.forks_count
                                )}
                            </span>

                            <span>
                                Updated ${timeAgo(repository.updated_at)}
                            </span>
                        </div>
                    </div>
                `)
                .join("");
        }

        function renderActivity(events) {
            const container = document.getElementById("activity");

            if (events.length === 0) {
                container.innerHTML =
                    `<p class="empty">No recent public activity.</p>`;
                return;
            }

            container.innerHTML = events
                .slice(0, 7)
                .map(event => {
                    const activity = describeActivity(event);

                    return `
                        <div class="activity-item">
                            <span class="activity-icon">
                                ${activity.icon}
                            </span>

                            <div class="activity-text">
                                ${activity.text}

                                <span class="activity-time">
                                    ${timeAgo(event.created_at)}
                                </span>
                            </div>
                        </div>
                    `;
                })
                .join("");
        }

        function describeActivity(event) {
            const repository = escapeHtml(
                event.repo?.name || "a repository"
            );

            switch (event.type) {
                case "PushEvent":
                    return {
                        icon: "📤",
                        text: `Pushed commits to <strong>${repository}</strong>`
                    };

                case "CreateEvent":
                    return {
                        icon: "✨",
                        text: `Created something in <strong>${repository}</strong>`
                    };

                case "WatchEvent":
                    return {
                        icon: "⭐",
                        text: `Starred <strong>${repository}</strong>`
                    };

                case "ForkEvent":
                    return {
                        icon: "🍴",
                        text: `Forked <strong>${repository}</strong>`
                    };

                case "IssuesEvent":
                    return {
                        icon: "🎯",
                        text: `Worked on an issue in <strong>${repository}</strong>`
                    };

                case "PullRequestEvent":
                    return {
                        icon: "🔀",
                        text: `Worked on a pull request in <strong>${repository}</strong>`
                    };

                default:
                    return {
                        icon: "•",
                        text: `Public activity in <strong>${repository}</strong>`
                    };
            }
        }

        function setupTheme() {
            const savedTheme =
                localStorage.getItem("explorer-theme");

            if (savedTheme === "dark") {
                document.body.classList.add("dark");
                themeButton.textContent = "☀️";
            }
        }

        function saveRecentSearch(username) {
            const searches = getRecentSearches().filter(
                item =>
                    item.toLowerCase() !== username.toLowerCase()
            );

            searches.unshift(username);

            localStorage.setItem(
                "recent-github-searches",
                JSON.stringify(searches.slice(0, 5))
            );
        }

        function getRecentSearches() {
            try {
                return JSON.parse(
                    localStorage.getItem(
                        "recent-github-searches"
                    )
                ) || [];
            } catch {
                return [];
            }
        }

        function showRecentSearches() {
            const searches = getRecentSearches();

            if (searches.length === 0) {
                recentSearches.innerHTML =
                    `<span style="color: var(--muted); font-size: 13px;">
                        Try: torvalds, addyosmani or sindresorhus
                    </span>`;
                return;
            }

            recentSearches.innerHTML = searches
                .map(username => `
                    <button
                        class="recent-button"
                        type="button"
                        data-username="${escapeHtml(username)}"
                    >
                        @${escapeHtml(username)}
                    </button>
                `)
                .join("");

            document
                .querySelectorAll(".recent-button")
                .forEach(button => {
                    button.addEventListener("click", function () {
                        usernameInput.value =
                            button.dataset.username;

                        searchUser(button.dataset.username);
                    });
                });
        }

        function loadUserFromUrl() {
            const parameters =
                new URLSearchParams(window.location.search);

            const username = parameters.get("user");

            if (username) {
                usernameInput.value = username;
                searchUser(username);
            }
        }

        function updateUrl(username) {
            const url = new URL(window.location.href);
            url.searchParams.set("user", username);

            window.history.replaceState({}, "", url);
        }

        function showStatus(message, isError = false) {
            statusBox.textContent = message;
            statusBox.className =
                `status visible${isError ? " error" : ""}`;
        }

        function hideStatus() {
            statusBox.className = "status";
        }

        function isValidUsername(username) {
            return (
                /^[a-zA-Z0-9-]{1,39}$/.test(username) &&
                !username.startsWith("-") &&
                !username.endsWith("-")
            );
        }

        function formatDate(date) {
            return new Intl.DateTimeFormat("en", {
                year: "numeric",
                month: "short",
                day: "numeric"
            }).format(new Date(date));
        }

        function formatNumber(number) {
            return new Intl.NumberFormat("en", {
                notation: number >= 1000 ? "compact" : "standard",
                maximumFractionDigits: 1
            }).format(number);
        }

        function timeAgo(date) {
            const seconds = Math.floor(
                (Date.now() - new Date(date).getTime()) / 1000
            );

            const times = [
                ["year", 31536000],
                ["month", 2592000],
                ["day", 86400],
                ["hour", 3600],
                ["minute", 60]
            ];

            for (const [name, value] of times) {
                const amount = Math.floor(seconds / value);

                if (amount >= 1) {
                    return `${amount} ${name}${amount > 1 ? "s" : ""} ago`;
                }
            }

            return "just now";
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>
</body>
</html>
