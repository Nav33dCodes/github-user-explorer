<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Explorer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 70px auto;
            padding: 20px;
            text-align: center;
        }

        input, button {
            padding: 12px;
            font-size: 16px;
        }

        input {
            width: 60%;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
        }

        img {
            width: 130px;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <h1>GitHub User Explorer</h1>

    <p>Search for a GitHub user using the GitHub REST API.</p>

    <input id="username" placeholder="Enter GitHub username">
    <button onclick="findUser()">Search</button>

    <div id="result"></div>

    <script>
        async function findUser() {
            const username = document
                .getElementById("username")
                .value
                .trim();

            const result = document.getElementById("result");

            if (!username) {
                result.innerHTML = "<p>Please enter a username.</p>";
                return;
            }

            result.innerHTML = "<p>Loading...</p>";

            try {
                const response = await fetch(
                    `https://api.github.com/users/${encodeURIComponent(username)}`
                );

                if (!response.ok) {
                    throw new Error("GitHub user not found.");
                }

                const user = await response.json();

                result.innerHTML = `
                    <img src="${user.avatar_url}" alt="GitHub profile picture">
                    <h2>${user.name || user.login}</h2>
                    <p>${user.bio || "No bio available."}</p>
                    <p>Public repositories: ${user.public_repos}</p>
                    <p>Followers: ${user.followers}</p>
                    <a href="${user.html_url}" target="_blank">
                        Open GitHub Profile
                    </a>
                `;
            } catch (error) {
                result.innerHTML = `<p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
